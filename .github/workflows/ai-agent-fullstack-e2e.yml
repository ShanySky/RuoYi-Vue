name: AI Agent Fullstack E2E

# Closed-loop acceptance resolves the paired frontend ref from the backend ref at checkout.
# Settings-boundary branch run also exercises ordinary-user personal settings isolation and persisted user model/reasoning preferences.
# /tmp/acceptance-revisions.txt is the authoritative branch/SHA evidence for each run.

on:
  push:
    branches:
      - chatgpt/ai-agent-assistant
      - chatgpt/ai-agent-hardening-phase35-p0
      - chatgpt/ai-agent-phase35-p1-closure
      - chatgpt/ai-settings-boundary-closure
    paths:
      - '.github/workflows/ai-agent-fullstack-e2e.yml'
      - 'ruoyi-ai/**'
      - 'sql/ai_fresh_install.sql'
      - 'sql/ai_migrations/**'
      - 'scripts/ci/**'
  pull_request:
    branches:
      - chatgpt/ai-agent-assistant
    paths:
      - '.github/workflows/ai-agent-fullstack-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Vue3 frontend
        uses: actions/checkout@v4
        with:
          repository: ShanySky/RuoYi-Vue3
          ref: ${{ github.ref_name == 'chatgpt/ai-settings-boundary-closure' && 'chatgpt/ai-settings-boundary-closure' || github.event_name == 'pull_request' && 'chatgpt/ai-settings-boundary-closure' || github.ref_name == 'chatgpt/ai-agent-hardening-phase35-p0' && 'chatgpt/ai-agent-hardening-phase35-p0' || github.ref_name == 'chatgpt/ai-agent-phase35-p1-closure' && 'chatgpt/ai-agent-phase35-p1-closure' || 'chatgpt/ai-agent-assistant' }}
          path: frontend

      - name: Record acceptance revisions
        run: |
          {
            echo "BACKEND_REF=${{ github.ref_name }}"
            echo "FRONTEND_REF=${{ github.ref_name == 'chatgpt/ai-settings-boundary-closure' && 'chatgpt/ai-settings-boundary-closure' || github.event_name == 'pull_request' && 'chatgpt/ai-settings-boundary-closure' || github.ref_name == 'chatgpt/ai-agent-hardening-phase35-p0' && 'chatgpt/ai-agent-hardening-phase35-p0' || github.ref_name == 'chatgpt/ai-agent-phase35-p1-closure' && 'chatgpt/ai-agent-phase35-p1-closure' || 'chatgpt/ai-agent-assistant' }}"
            echo "BACKEND_SHA=$(git -C backend rev-parse HEAD)"
            echo "FRONTEND_SHA=$(git -C frontend rev-parse HEAD)"
          } | tee /tmp/acceptance-revisions.txt

      # Final I3 browser suite covers the default 64K/75% threshold and representative cross-module Page Capability smoke.
      - name: Validate browser acceptance script syntax
        working-directory: frontend
        run: node --check tests/ai-agent-e2e.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize database
        run: |
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < backend/sql/ry_20260417.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < backend/sql/quartz.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < backend/sql/ai_fresh_install.sql
          mysql -h127.0.0.1 -uroot -ppassword -e "update sys_config set config_value='false' where config_key='sys.account.captchaEnabled'; insert ignore into sys_role_menu(role_id,menu_id) values(2,118),(2,1061); insert into ai_conversation(user_id,model_id,reasoning_effort,title,route,status,create_time,update_time) values(1,null,null,'H_EXPIRED_CLEANUP','/index','ACTIVE',date_sub(sysdate(),interval 120 day),date_sub(sysdate(),interval 120 day));" ry-vue

      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests clean package

      - name: Start deterministic OpenAI-compatible mock
        run: |
          cat > /tmp/mock_openai.py <<'PY'
          import json
          import time
          import uuid
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          def tool_call(name, args):
              return {
                  'role': 'assistant',
                  'content': None,
                  'tool_calls': [{
                      'id': 'call_' + uuid.uuid4().hex,
                      'type': 'function',
                      'function': {'name': name, 'arguments': json.dumps(args, ensure_ascii=False)}
                  }]
              }

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print(fmt % args, flush=True)

              def send_json(self, status, obj):
                  payload = json.dumps(obj, ensure_ascii=False).encode()
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  if self.path == '/v1/models':
                      self.send_json(200, {
                          'object': 'list',
                          'data': [
                              {
                                  'id': 'mock-agent-model',
                                  'object': 'model',
                                  'created': int(time.time()),
                                  'owned_by': 'e2e'
                              },
                              {
                                  'id': 'mock-secondary-model',
                                  'object': 'model',
                                  'created': int(time.time()),
                                  'owned_by': 'e2e'
                              }
                          ]
                      })
                  else:
                      self.send_json(404, {'error': 'not found'})

              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0'))
                  body = json.loads(self.rfile.read(length) or b'{}')
                  if self.path != '/v1/chat/completions':
                      self.send_json(404, {'error': 'not found'})
                      return

                  messages = body.get('messages') or []
                  tools = body.get('tools') or []
                  names = [((tool.get('function') or {}).get('name')) for tool in tools]
                  latest_user = next((msg.get('content') or '' for msg in reversed(messages) if msg.get('role') == 'user'), '')
                  system_text = '\n'.join(str(msg.get('content') or '') for msg in messages if msg.get('role') == 'system')
                  finish = 'stop'

                  if latest_user == 'Reply with exactly AI_OK.' and body.get('model') == 'mock-agent-model' and body.get('reasoning_effort') == 'minimal':
                      self.send_json(400, {'error': {'message': 'Unsupported reasoning_effort: minimal'}})
                      return

                  if 'H_COMPACTION_PROMPT_MARKER' in system_text:
                      message = {'role': 'assistant', 'content': 'H_COMPACTION_APPLIED'}
                  elif latest_user.startswith('需要压缩的后续历史：'):
                      time.sleep(1.2)
                      message = {
                          'role': 'assistant',
                          'content': 'DEFAULT_COMPACTION_APPLIED\n## 任务主线\n- 当前主题：UI_COMPACTION\n- 最终目标：压缩后继续当前任务\n## 待办与下一步\n- 下一步：继续最新用户指令'
                      }
                  elif 'H_SYSTEM_PROMPT_MARKER' in system_text and 'H_PROMPT_APPLY' in latest_user:
                      message = {'role': 'assistant', 'content': 'H_SYSTEM_PROMPT_APPLIED'}
                  elif 'H_PAGE_DISABLED_TOOL' in latest_user:
                      message = tool_call('page_system_user_search', {'userName': 'ry'})
                      finish = 'tool_calls'
                  elif 'H_SECURITY_PROMPT_TEST' in latest_user:
                      message = tool_call('page_unregistered_admin_write', {})
                      finish = 'tool_calls'
                  elif 'ai_echo_test' in names:
                      message = tool_call('ai_echo_test', {'value': 'AI_OK'})
                      finish = 'tool_calls'
                  elif 'SLOW_STOP_TEST' in latest_user:
                      time.sleep(4)
                      message = {'role': 'assistant', 'content': 'SLOW_STOP_DONE'}
                  elif 'SLOW_ESC_TEST' in latest_user:
                      time.sleep(4)
                      message = {'role': 'assistant', 'content': 'SLOW_ESC_DONE'}
                  elif 'STEER_OLD' in latest_user:
                      time.sleep(4)
                      message = {'role': 'assistant', 'content': 'STEER_OLD_DONE'}
                  elif 'STEER_COMPACT_NEW' in latest_user:
                      message = {'role': 'assistant', 'content': 'STEER_COMPACT_NEW_OK'}
                  elif 'STEER_AFTER_WRITE_NEW' in latest_user:
                      message = {'role': 'assistant', 'content': 'WRITE_COMPLETED_THEN_STEERED'}
                  elif 'STEER_NEW' in latest_user:
                      message = {'role': 'assistant', 'content': 'STEER_NEW_OK'}
                  elif 'STEER_CANCEL_WRITE' in latest_user:
                      tool_history = '\n'.join(str(msg.get('content') or '') for msg in messages if msg.get('role') == 'tool')
                      message = {
                          'role': 'assistant',
                          'content': 'WRITE_CANCELLED_BY_STEERING' if ('rows' in tool_history and 'ry' in tool_history)
                              else 'STEERING_HISTORY_MISSING'
                      }
                  elif 'RISK_POLICY_RESET_PASSWORD' in latest_user:
                      message = tool_call('page_system_user_reset_password', {'userId': 2, 'password': 'ShouldNotExecute123!'})
                      finish = 'tool_calls'
                  elif latest_user.startswith('UI_COMPACT_'):
                      message = {
                          'role': 'assistant',
                          'content': 'AI_OK:%s:%s' % (
                              body.get('model'),
                              body.get('reasoning_effort') or 'default'
                          )
                      }
                  elif 'CROSS_PAGE_ROLE_ASSIGN' in latest_user:
                      tool_results = [msg for msg in messages if msg.get('role') == 'tool']
                      step = len(tool_results)

                      def parsed_tool_payloads():
                          values = []
                          for item in tool_results:
                              try:
                                  values.append(json.loads(item.get('content') or '{}'))
                              except Exception:
                                  pass
                          return values

                      def find_cross_role_id():
                          for payload in reversed(parsed_tool_payloads()):
                              result = payload.get('result') or {}
                              for row in result.get('rows') or []:
                                  if row.get('roleKey') == 'e2e_cross_page':
                                      return row.get('roleId')
                          return None

                      if step == 0:
                          message = tool_call('page_system_user_search', {'userName': 'ry'})
                          finish = 'tool_calls'
                      elif step == 1:
                          message = tool_call('app_navigate', {'path': '/system/role'})
                          finish = 'tool_calls'
                      elif step == 2:
                          message = tool_call('page_system_role_search', {'roleName': 'E2E跨页角色'})
                          finish = 'tool_calls'
                      elif step == 3:
                          message = tool_call('page_system_role_add_open', {})
                          finish = 'tool_calls'
                      elif step == 4:
                          message = tool_call('page_system_role_add_set_fields', {
                              'roleName': 'E2E跨页角色',
                              'roleKey': 'e2e_cross_page',
                              'roleSort': 99,
                              'status': '0',
                              'remark': 'AI cross-page E2E'
                          })
                          finish = 'tool_calls'
                      elif step == 5:
                          message = tool_call('page_system_role_add_submit', {})
                          finish = 'tool_calls'
                      elif step == 6:
                          message = tool_call('page_system_role_search', {'roleName': 'E2E跨页角色'})
                          finish = 'tool_calls'
                      elif step == 7:
                          message = tool_call('app_navigate', {'path': '/system/user-auth/role/2'})
                          finish = 'tool_calls'
                      elif step == 8:
                          message = tool_call('page_system_user_auth_role_view', {})
                          finish = 'tool_calls'
                      elif step == 9:
                          role_id = find_cross_role_id()
                          if role_id is None:
                              message = {'role': 'assistant', 'content': 'CROSS_PAGE_ROLE_ID_MISSING'}
                          else:
                              selected = []
                              for payload in reversed(parsed_tool_payloads()):
                                  result = payload.get('result') or {}
                                  if result.get('selectedRoleIds') is not None:
                                      selected = list(result.get('selectedRoleIds') or [])
                                      break
                              if role_id not in selected:
                                  selected.append(role_id)
                              message = tool_call('page_system_user_auth_role_select', {'roleIds': selected})
                              finish = 'tool_calls'
                      elif step == 10:
                          message = tool_call('page_system_user_auth_role_submit', {})
                          finish = 'tool_calls'
                      else:
                          message = {'role': 'assistant', 'content': 'CROSS_PAGE_ROLE_ASSIGN_DONE'}
                  elif any(name and name.startswith('page_system_user_') for name in names):
                      wants_login_name_change = (
                          any(word in latest_user for word in ['用户名称', '用户名', '登录账号', 'userName'])
                          and any(word in latest_user for word in ['修改', '改成', '改为', '换成'])
                      )
                      runtime_isolation = 'RUNTIME_ISOLATION' in latest_user
                      steer_write_old = 'STEER_WRITE_OLD' in latest_user
                      steer_write_done_old = 'STEER_WRITE_DONE_OLD' in latest_user
                      tool_results = [msg for msg in messages if msg.get('role') == 'tool']
                      step = len(tool_results)
                      if runtime_isolation and step > 0:
                          message = {
                              'role': 'assistant',
                              'content': 'ISOLATION:%s:%s' % (
                                  body.get('model'),
                                  body.get('reasoning_effort') or 'default'
                              )
                          }
                      elif wants_login_name_change and step == 0:
                          message = {'role': 'assistant', 'content': '当前 RuoYi 不支持修改已有用户的登录账号 userName；可以修改的是用户昵称 nickName。'}
                      elif step == 0:
                          message = tool_call('page_system_user_search', {'userName': 'ry'})
                          finish = 'tool_calls'
                      elif step == 1:
                          message = tool_call('page_system_user_edit_open', {'userId': 2})
                          finish = 'tool_calls'
                      elif step == 2:
                          nickname = (
                              'SHOULD_NOT_SAVE' if steer_write_old
                              else ('STEER_WRITE_DONE_ONCE' if steer_write_done_old else 'AI闭环测试')
                          )
                          message = tool_call('page_system_user_edit_set_fields', {'nickName': nickname})
                          finish = 'tool_calls'
                      elif step == 3:
                          message = tool_call('page_system_user_edit_submit', {})
                          finish = 'tool_calls'
                      else:
                          if steer_write_done_old:
                              time.sleep(4)
                              message = {'role': 'assistant', 'content': 'STEER_WRITE_DONE_OLD_FINISHED'}
                          else:
                              message = {'role': 'assistant', 'content': 'E2E_DONE'}
                  else:
                      message = {
                          'role': 'assistant',
                          'content': 'AI_OK:%s:%s' % (body.get('model'), body.get('reasoning_effort') or 'default')
                      }

                  self.send_json(200, {
                      'id': 'chatcmpl-e2e',
                      'object': 'chat.completion',
                      'created': int(time.time()),
                      'model': body.get('model', 'mock-agent-model'),
                      'choices': [{'index': 0, 'message': message, 'finish_reason': finish}],
                      'usage': {'prompt_tokens': 1, 'completion_tokens': 1, 'total_tokens': 2}
                  })

          ThreadingHTTPServer(('127.0.0.1', 18080), Handler).serve_forever()
          PY

          nohup python3 /tmp/mock_openai.py > /tmp/mock-openai.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/models >/tmp/mock-models.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-openai.log
          exit 1

      - name: Start RuoYi backend
        working-directory: backend
        env:
          AI_MASTER_KEY: e2e-isolated-master-key
        run: |
          sudo mkdir -p /home/ruoyi/logs /home/ruoyi/uploadPath
          sudo chown -R "$USER":"$USER" /home/ruoyi
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar > /tmp/ruoyi-backend.log 2>&1 &
          echo $! > /tmp/ruoyi-backend.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/captchaImage >/tmp/captcha.json; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ruoyi-backend.pid)" 2>/dev/null; then
              cat /tmp/ruoyi-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/ruoyi-backend.log
          exit 1

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vue3 frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/ruoyi-frontend.log 2>&1 &
          echo $! > /tmp/ruoyi-frontend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/tmp/frontend.html               && curl -fsS http://127.0.0.1:5173/dev-api/captchaImage >/tmp/frontend-captcha.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ruoyi-frontend.log
          exit 1

      - name: Validate frontend Capability Contract v1
        working-directory: frontend
        run: node tests/ai-capability-contract.test.mjs

      - name: Validate AI settings boundary contract
        working-directory: frontend
        run: node tests/ai-settings-boundary.test.mjs

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build:prod

      # Browser acceptance always uses the paired frontend branch selected above.
      - name: Run browser closed-loop acceptance
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:5173
          BACKEND_URL: http://127.0.0.1:8080
          PROVIDER_URL: http://127.0.0.1:18080/v1
          PROVIDER_TOKEN: e2e-provider-placeholder
          TEST_NICKNAME: AI闭环测试
        shell: bash
        run: |
          set -o pipefail
          node tests/ai-agent-e2e.mjs 2>&1 | tee /tmp/ai-agent-e2e.log

      - name: Verify phase-three visual evidence files
        working-directory: frontend
        run: |
          test -s test-results/phase3-ai-floating.png
          test -s test-results/phase3-ai-dock.png
          test -s test-results/phase3-ai-model-picker.png

      - name: Verify persistence, audit redaction and Agent state
        run: |
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select nick_name from sys_user where user_id=2" ry-vue)" = "AI闭环测试"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_pending_tool_call where status='RESOLVED'" ry-vue)" -ge 4
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='AI_OK:mock-agent-model:high' and model_code='mock-agent-model' and reasoning_effort='high'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='AI_OK:mock-secondary-model:low' and model_code='mock-secondary-model' and reasoning_effort='low'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from (select conversation_id from ai_message where role='ASSISTANT' and model_code is not null group by conversation_id having count(distinct model_code) >= 2) x" ry-vue)" -ge 1

          # Phase-three Run control must be true in the backend, not only hidden by the browser.
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where status='CANCELLED' and cancel_reason='USER_STOP'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where status='CANCELLED' and cancel_reason='DOUBLE_ESC'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where status='SUPERSEDED' and cancel_reason='STEERING'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where status='COMPACTING'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_model where context_window_tokens<>65536 or auto_compaction<>'0' or compaction_threshold_percent<>75" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content in ('SLOW_STOP_DONE','SLOW_ESC_DONE','STEER_OLD_DONE')" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='STEER_NEW_OK'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select chat_font_size from ai_user_preference where user_id=1" ry-vue)" = "standard"

          # Phase-three Conversation recovery and account preferences must survive real reload/logout flows.
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_conversation where user_id=1 and title='G_HISTORY_RESTORE_TEST'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_conversation where user_id=1 and title='G_RENAMED_CONVERSATION'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where user_id=1 and status='CANCELLED' and cancel_reason='CLIENT_RELOAD'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where user_id=1 and status='CANCELLED' and cancel_reason='USER_LOGOUT'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select history_entry_visible from ai_user_preference where user_id=1" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select auto_restore_last_conversation from ai_user_preference where user_id=1" ry-vue)" = "1"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select send_shortcut from ai_user_preference where user_id=1" ry-vue)" = "ctrl-enter"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_conversation where title='H_EXPIRED_CLEANUP'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select config_value from sys_config where config_key='ai.conversation.retentionDays'" ry-vue)" = "90"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select config_value from sys_config where config_key='ai.conversation.userArchiveEnabled'" ry-vue)" = "true"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select config_value from sys_config where config_key='ai.conversation.userDeleteEnabled'" ry-vue)" = "false"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select enabled from ai_page_config where route='/system/user'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_prompt where content=default_content and enabled='0'" ry-vue)" = "2"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_checkpoint where summary like '%H_COMPACTION_APPLIED%'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_checkpoint where summary like '%DEFAULT_COMPACTION_APPLIED%'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run r join ai_conversation c on c.conversation_id=r.conversation_id where c.title like 'UI_COMPACT_STOP_ONE%' and r.status='CANCELLED' and r.cancel_reason='USER_STOP'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run r join ai_conversation c on c.conversation_id=r.conversation_id where c.title like 'UI_COMPACT_RELOAD_ONE%' and r.status='CANCELLED' and r.cancel_reason='CLIENT_RELOAD'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run r join ai_conversation c on c.conversation_id=r.conversation_id where c.title like 'UI_COMPACT_STEER_ONE%' and r.status='SUPERSEDED' and r.cancel_reason='STEERING'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_checkpoint cp join ai_run r on r.run_id=cp.run_id join ai_conversation c on c.conversation_id=r.conversation_id where c.title like 'UI_COMPACT_STEER_ONE%' and r.status='SUPERSEDED' and r.cancel_reason='STEERING'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_checkpoint c join ai_conversation v on v.conversation_id=c.conversation_id where v.title like 'UI_COMPACT_STOP_ONE%' or v.title like 'UI_COMPACT_RELOAD_ONE%'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='STEER_COMPACT_NEW_OK'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='WRITE_COMPLETED_THEN_STEERED'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='STEER_WRITE_DONE_OLD_FINISHED'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_pending_tool_call where tool_name like 'page_%' and (capability_protocol is null or capability_protocol<>'ruoyi-semantic-page-v1' or page_id is null or page_id='' or route is null or route='' or page_instance_id is null or page_instance_id='' or page_version is null)" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_pending_tool_call where capability_protocol='ruoyi-semantic-page-v1' and page_id='system.user' and route='/system/user'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run r join ai_checkpoint c on c.run_id=r.run_id where c.summary like '%H_COMPACTION_APPLIED%' and r.compaction_prompt_version > 2" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='AI_OK:mock-agent-model:none' and reasoning_effort='none'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where role='ASSISTANT' and content='AI_OK:mock-agent-model:max' and reasoning_effort='max'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_user where user_name like 'a3%' and del_flag='0'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_user where user_name like 'a3%' and del_flag='2' and remark='R3 F4 full edit acceptance'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_oper_log where title in ('AI Prompt 配置','AI Prompt 恢复默认','AI 页面能力','AI 会话策略','AI 会话过期清理','AI 会话审计查看')" ry-vue)" -ge 6
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_role_menu where role_id=2 and menu_id in (118,1061)" ry-vue)" = "2"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_role_menu where role_id=2 and menu_id=2107" ry-vue)" = "0"

          sleep 2
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from sys_oper_log where title='AI 服务配置' and oper_param like '%e2e-provider-placeholder%'" ry-vue)" = "0"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_provider where token_cipher like 'v1:%' and token_cipher not like '%e2e-provider-placeholder%'" ry-vue)" = "1"
          mysql -h127.0.0.1 -uroot -ppassword -e "update sys_user set nick_name='若依' where user_id=2" ry-vue

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-fullstack-e2e
          path: |
            frontend/test-results/
            /tmp/ai-agent-e2e.log
            /tmp/acceptance-revisions.txt
            /tmp/ruoyi-backend.log
            /tmp/ruoyi-frontend.log
            /tmp/mock-openai.log
          if-no-files-found: warn
