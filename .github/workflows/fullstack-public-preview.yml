name: RuoYi Fullstack Public Preview

on:
  push:
    branches:
      - chatgpt/fullstack-public-preview
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Vue3 frontend
        uses: actions/checkout@v4
        with:
          repository: ShanySky/RuoYi-Vue3
          ref: master
          path: frontend

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Initialize MySQL schema
        working-directory: backend
        run: |
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/ry_20260417.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/quartz.sql
          mysql -h127.0.0.1 -uroot -ppassword -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ry-vue';"

      - name: Verify Redis
        run: docker run --rm --network host redis:7.4 redis-cli -h 127.0.0.1 ping

      - name: Build Spring Boot 4 backend
        working-directory: backend
        run: mvn -B -DskipTests clean package

      - name: Prepare runtime directories
        run: |
          sudo mkdir -p /home/ruoyi/logs /home/ruoyi/uploadPath
          sudo chown -R "$USER":"$USER" /home/ruoyi

      - name: Start Spring Boot backend
        working-directory: backend
        run: |
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar > /tmp/ruoyi-backend.log 2>&1 &
          echo $! > /tmp/ruoyi-backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/captchaImage > /tmp/captcha.json; then
              echo "Backend is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ruoyi-backend.pid)" 2>/dev/null; then
              echo "Backend process exited"
              cat /tmp/ruoyi-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/ruoyi-backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Allow external preview host in Vite runtime config
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.js')
          s = p.read_text()
          needle = '    server: {\n'
          if needle not in s:
              needle = '    server: {\r\n'
          if needle not in s:
              raise SystemExit('Could not locate Vite server config')
          s = s.replace(needle, needle + '      allowedHosts: true,\n', 1)
          p.write_text(s)
          PY
          grep -A5 -n "server:" vite.config.js

      - name: Start Vue3 Vite frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/ruoyi-frontend.log 2>&1 &
          echo $! > /tmp/ruoyi-frontend.pid

      - name: Wait for frontend and proxy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /tmp/frontend.html && curl -fsS http://127.0.0.1:5173/dev-api/captchaImage > /tmp/frontend-captcha.json; then
              echo "Frontend and backend proxy are ready"
              exit 0
            fi
            sleep 2
          done
          echo '===== frontend log ====='
          cat /tmp/ruoyi-frontend.log || true
          echo '===== backend log ====='
          cat /tmp/ruoyi-backend.log || true
          exit 1

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5173 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" | tee /tmp/public-url.txt
              echo "PUBLIC_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Verify public preview
        run: |
          echo "Public URL: $PUBLIC_PREVIEW_URL"
          for i in $(seq 1 45); do
            HOME_CODE=$(curl -sS -o /tmp/public-home.html -w '%{http_code}' "$PUBLIC_PREVIEW_URL/" || true)
            API_CODE=$(curl -sS -o /tmp/public-captcha.json -w '%{http_code}' "$PUBLIC_PREVIEW_URL/dev-api/captchaImage" || true)
            echo "Attempt $i: home=$HOME_CODE api=$API_CODE"
            if [ "$HOME_CODE" = "200" ] && [ "$API_CODE" = "200" ]; then
              echo "Public preview is reachable"
              exit 0
            fi
            sleep 2
          done
          echo '===== cloudflared ====='
          cat /tmp/cloudflared.log || true
          echo '===== frontend ====='
          cat /tmp/ruoyi-frontend.log || true
          exit 1

      - name: Upload preview details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-details
          path: |
            /tmp/public-url.txt
            /tmp/public-captcha.json
            /tmp/cloudflared.log
            /tmp/ruoyi-backend.log
            /tmp/ruoyi-frontend.log
          if-no-files-found: warn

      - name: Keep preview alive for manual testing
        run: |
          echo "Preview URL: $PUBLIC_PREVIEW_URL"
          echo "Keeping the preview alive for up to 60 minutes. Cancel the workflow when finished."
          sleep 3600
