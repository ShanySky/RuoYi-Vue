name: AI Agent Backend CI

on:
  push:
    branches:
      - chatgpt/ai-agent-assistant
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database
        run: |
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/ry_20260417.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/quartz.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/ai_20260918.sql
          mysql -h127.0.0.1 -uroot -ppassword -e "update sys_config set config_value='false' where config_key='sys.account.captchaEnabled'" ry-vue
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ry-vue' AND table_name LIKE 'ai_%';")" -ge "10"

      - name: Build backend
        shell: bash
        run: |
          set -o pipefail
          mvn -B -DskipTests clean package 2>&1 | tee /tmp/maven-build.log

      - name: Start mock OpenAI-compatible provider
        run: |
          cat > /tmp/mock_openai.py <<'PY'
          import json, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print(fmt % args, flush=True)

              def send_json(self, status, obj):
                  payload = json.dumps(obj, ensure_ascii=False).encode()
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  if self.path == '/v1/models':
                      self.send_json(200, {'object':'list','data':[{'id':'mock-agent-model','object':'model','created':int(time.time()),'owned_by':'ci'}]})
                  else:
                      self.send_json(404, {'error':'not found'})

              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0'))
                  body = json.loads(self.rfile.read(length) or b'{}')
                  if self.path != '/v1/chat/completions':
                      self.send_json(404, {'error':'not found'})
                      return
                  messages = body.get('messages') or []
                  tools = body.get('tools') or []
                  last = messages[-1] if messages else {}
                  is_compaction = any(
                      msg.get('role') == 'system' and 'Agent Checkpoint' in (msg.get('content') or '')
                      for msg in messages
                  )
                  checkpoint_system = next((
                      msg.get('content') or '' for msg in messages
                      if msg.get('role') == 'system' and 'Conversation Checkpoint' in (msg.get('content') or '')
                  ), '')
                  latest_user = next((
                      msg.get('content') or '' for msg in reversed(messages) if msg.get('role') == 'user'
                  ), '')
                  if body.get('prompt_cache_key'):
                      print('CACHE_KEY=' + str(body.get('prompt_cache_key')), flush=True)
                  if 'CACHE_UNSUPPORTED_PROVIDER_TEST' in latest_user and body.get('prompt_cache_key'):
                      print('CACHE_UNSUPPORTED_REJECTED=1', flush=True)
                      self.send_json(400, {'error': {'message': 'Unsupported parameter: prompt_cache_key'}})
                      return
                  if is_compaction:
                      compaction_system = next((msg.get('content') or '' for msg in messages if msg.get('role') == 'system'), '')
                      if '## 任务主线' in compaction_system and '## Tool 与确认状态' in compaction_system:
                          print('COMPACTION_PROMPT_STRUCTURED=1', flush=True)
                      if 'LONG_CONTEXT_A:' in latest_user:
                          print('COMPACTION_SOURCE_HAS_A=1', flush=True)
                      message = {'role':'assistant','content':'CHECKPOINT_OK\n## 任务主线\n- 当前主题：LONG_CONTEXT\n- 最终目标：继续处理最新用户指令\n## 已完成工作与真实结果\n- 已完成工作：LONG_CONTEXT_A 已处理\n## 待办与下一步\n- 下一步：处理 LONG_CONTEXT_B'}
                      finish = 'stop'
                  elif 'CACHE_UNSUPPORTED_PROVIDER_TEST' in latest_user:
                      message = {'role':'assistant','content':'CACHE_FALLBACK_OK'}
                      finish = 'stop'
                  elif 'LONG_CONTEXT_B:' in latest_user:
                      if 'CHECKPOINT_OK' in checkpoint_system and latest_user.startswith('LONG_CONTEXT_B:'):
                          print('CHECKPOINT_REINJECTED=1', flush=True)
                          print('LATEST_USER_RAW=1', flush=True)
                          message = {'role':'assistant','content':'CHECKPOINT_CONTINUED_OK'}
                      else:
                          message = {'role':'assistant','content':'CHECKPOINT_CONTEXT_MISSING'}
                      finish = 'stop'
                  elif last.get('role') == 'tool':
                      message = {'role':'assistant','content':'TOOL_RESULT_ACCEPTED'}
                      finish = 'stop'
                  elif tools:
                      names = [((t.get('function') or {}).get('name')) for t in tools]
                      name = 'page_system_user_search' if 'page_system_user_search' in names else names[0]
                      args = {'userName':'ry'} if name == 'page_system_user_search' else {}
                      # Intentionally repeat the provider id across user turns. Runtime must normalize it.
                      message = {'role':'assistant','content':None,'tool_calls':[{'id':'call_ci_repeated','type':'function','function':{'name':name,'arguments':json.dumps(args)}}]}
                      finish = 'tool_calls'
                  else:
                      message = {'role':'assistant','content':'AI_OK'}
                      finish = 'stop'
                  self.send_json(200, {
                      'id':'chatcmpl-ci','object':'chat.completion','created':int(time.time()),'model':body.get('model','mock-agent-model'),
                      'choices':[{'index':0,'message':message,'finish_reason':finish}],
                      'usage':{'prompt_tokens':8,'completion_tokens':1,'total_tokens':9,'prompt_tokens_details':{'cached_tokens':4}}
                  })

          ThreadingHTTPServer(('127.0.0.1', 18080), Handler).serve_forever()
          PY
          nohup python3 /tmp/mock_openai.py > /tmp/mock-openai.log 2>&1 &
          echo $! > /tmp/mock-openai.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/v1/models >/tmp/models.json && exit 0
            sleep 1
          done
          cat /tmp/mock-openai.log
          exit 1

      - name: Start RuoYi backend
        env:
          AI_MASTER_KEY: ci-only-master-key
        run: |
          sudo mkdir -p /home/ruoyi/logs /home/ruoyi/uploadPath
          sudo chown -R "$USER":"$USER" /home/ruoyi
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar > /tmp/ruoyi-backend.log 2>&1 &
          echo $! > /tmp/ruoyi-backend.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/captchaImage >/tmp/captcha.json; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ruoyi-backend.pid)" 2>/dev/null; then
              cat /tmp/ruoyi-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/ruoyi-backend.log
          exit 1

      - name: Verify AI Provider and Agent API
        run: |
          set -euo pipefail
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:8080/login)
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          AUTH="Authorization: Bearer $TOKEN"

          PROVIDER=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"CI Mock","baseUrl":"http://127.0.0.1:18080/v1","token":"ci-token","enabled":true,"timeoutSeconds":10}' \
            http://127.0.0.1:8080/ai/config/provider)
          printf '%s' "$PROVIDER" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert d["data"]["hasToken"] is True; assert "tokenCipher" not in d["data"]'

          DISCOVERED=$(curl -fsS -H "$AUTH" -X POST http://127.0.0.1:8080/ai/config/models/discover)
          printf '%s' "$DISCOVERED" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert d["data"]==["mock-agent-model"]'
          curl -fsS -H "$AUTH" http://127.0.0.1:8080/ai/config/models | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert d["data"]==[]'
          ADDED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X POST -d '{"modelCodes":["mock-agent-model"]}' http://127.0.0.1:8080/ai/config/models)
          MODEL_ID=$(printf '%s' "$ADDED" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert len(d["data"])==1; print(d["data"][0]["modelId"])')
          curl -fsS -H "$AUTH" -X PUT "http://127.0.0.1:8080/ai/config/models/$MODEL_ID/default" >/tmp/default.json
          curl -fsS -H "$AUTH" -X POST "http://127.0.0.1:8080/ai/config/models/$MODEL_ID/test-chat" | tee /tmp/test-chat.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert d["data"]=="AI_OK"'
          curl -fsS -H "$AUTH" -X POST "http://127.0.0.1:8080/ai/config/models/$MODEL_ID/test-tools" | tee /tmp/test-tools.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; assert d["data"]=="SUPPORTED"'

          cat > /tmp/turn1.json <<JSON
          {"modelId":$MODEL_ID,"userMessage":"请查一下用户 ry","route":"/system/user","pageContext":{"pageName":"用户管理"},"frontendTools":[{"name":"page_system_user_search","description":"查询用户","inputSchema":{"type":"object","properties":{"userName":{"type":"string"}},"additionalProperties":false}}]}
          JSON
          TURN1=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/turn1.json http://127.0.0.1:8080/ai/chat/turn)
          printf '%s' "$TURN1" | tee /tmp/turn1-response.json
          CONV_ID=$(printf '%s' "$TURN1" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="TOOL_CALL"; assert d["toolCall"]["name"]=="page_system_user_search"; print(d["conversationId"])')
          CALL_ID=$(printf '%s' "$TURN1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["toolCall"]["callId"])')

          cat > /tmp/turn2.json <<JSON
          {"conversationId":$CONV_ID,"toolResult":{"callId":"$CALL_ID","success":true,"result":{"total":1,"rows":[{"userId":2,"userName":"ry","nickName":"若依"}]}},"route":"/system/user","pageContext":{"pageName":"用户管理","total":1},"frontendTools":[{"name":"page_system_user_search","description":"查询用户","inputSchema":{"type":"object","properties":{"userName":{"type":"string"}},"additionalProperties":false}}]}
          JSON
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/turn2.json http://127.0.0.1:8080/ai/chat/turn | tee /tmp/turn2-response.json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="MESSAGE"; assert d["message"]=="TOOL_RESULT_ACCEPTED"'

          # Same conversation, second user turn. Mock intentionally emits the same provider tool_call.id.
          # The runtime must return a new internal callId and complete without a DB unique-key error.
          cat > /tmp/turn3.json <<JSON
          {"conversationId":$CONV_ID,"modelId":$MODEL_ID,"userMessage":"再查一次用户 ry","route":"/system/user","pageContext":{"pageName":"用户管理"},"frontendTools":[{"name":"page_system_user_search","description":"查询用户","inputSchema":{"type":"object","properties":{"userName":{"type":"string"}},"additionalProperties":false}}]}
          JSON
          TURN3=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/turn3.json http://127.0.0.1:8080/ai/chat/turn)
          printf '%s' "$TURN3" | tee /tmp/turn3-response.json
          CALL_ID_2=$(printf '%s' "$TURN3" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="TOOL_CALL"; print(d["toolCall"]["callId"])')
          test "$CALL_ID" != "$CALL_ID_2"

          cat > /tmp/turn4.json <<JSON
          {"conversationId":$CONV_ID,"toolResult":{"callId":"$CALL_ID_2","success":true,"result":{"total":1,"rows":[{"userId":2,"userName":"ry","nickName":"若依"}]}},"route":"/system/user","pageContext":{"pageName":"用户管理","total":1},"frontendTools":[{"name":"page_system_user_search","description":"查询用户","inputSchema":{"type":"object","properties":{"userName":{"type":"string"}},"additionalProperties":false}}]}
          JSON
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/turn4.json http://127.0.0.1:8080/ai/chat/turn | tee /tmp/turn4-response.json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="MESSAGE"; assert d["message"]=="TOOL_RESULT_ACCEPTED"'

          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_pending_tool_call where conversation_id=$CONV_ID and status='RESOLVED'" ry-vue)" = "2"
          mysql -h127.0.0.1 -uroot -ppassword -Nse "select concat((select count(*) from ai_conversation),' ',(select count(*) from ai_message),' ',(select count(*) from ai_pending_tool_call where status='RESOLVED'))" ry-vue

          CACHE_FALLBACK=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"modelId\":$MODEL_ID,\"userMessage\":\"CACHE_UNSUPPORTED_PROVIDER_TEST\",\"route\":\"/index\",\"pageContext\":{},\"frontendTools\":[]}" \
            http://127.0.0.1:8080/ai/chat/turn)
          printf '%s' "$CACHE_FALLBACK" | tee /tmp/cache-fallback-response.json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="MESSAGE"; assert d["message"]=="CACHE_FALLBACK_OK"'
          grep -q "CACHE_UNSUPPORTED_REJECTED=1" /tmp/mock-openai.log

          # Force a low context budget so automatic compaction can be verified quickly.
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X PUT             -d '{"contextWindowTokens":8192,"autoCompaction":true,"compactionThresholdPercent":50}'             "http://127.0.0.1:8080/ai/config/models/$MODEL_ID/runtime-settings"             | python3 -c 'import json,sys; assert json.load(sys.stdin)["code"]==200'

          CREATED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X POST             -d "{\"modelId\":$MODEL_ID,\"route\":\"/system/user\"}"             http://127.0.0.1:8080/ai/chat/conversations)
          LONG_CONV_ID=$(printf '%s' "$CREATED" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["code"]==200; print(d["data"]["conversationId"])')

          python3 - "$LONG_CONV_ID" "$MODEL_ID" <<'PY' >/tmp/long-turn1.json
          import json,sys
          cid=int(sys.argv[1]); mid=int(sys.argv[2])
          print(json.dumps({"conversationId":cid,"modelId":mid,"userMessage":"LONG_CONTEXT_A:"+("A"*11800),"route":"/system/user","pageContext":{"pageName":"用户管理"}}, ensure_ascii=False))
          PY
          LONG1=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/long-turn1.json http://127.0.0.1:8080/ai/chat/turn)
          printf '%s' "$LONG1" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="MESSAGE"; assert d["message"]=="AI_OK"'

          python3 - "$LONG_CONV_ID" "$MODEL_ID" <<'PY' >/tmp/long-turn2.json
          import json,sys
          cid=int(sys.argv[1]); mid=int(sys.argv[2])
          print(json.dumps({"conversationId":cid,"modelId":mid,"userMessage":"LONG_CONTEXT_B:"+("B"*11800),"route":"/system/user","pageContext":{"pageName":"用户管理"}}, ensure_ascii=False))
          PY
          LONG2=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/long-turn2.json http://127.0.0.1:8080/ai/chat/turn)
          printf '%s' "$LONG2" | tee /tmp/long-turn2-response.json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["type"]=="MESSAGE"; assert d["message"]=="CHECKPOINT_CONTINUED_OK"'

          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_checkpoint where conversation_id=$LONG_CONV_ID and status='ACTIVE' and summary like 'CHECKPOINT_OK%'" ry-vue)" -ge 1
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where conversation_id=$LONG_CONV_ID and role='USER' and content like 'LONG_CONTEXT_A:%'" ry-vue)" = "1"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_message where conversation_id=$LONG_CONV_ID and role='USER' and content like 'LONG_CONTEXT_B:%'" ry-vue)" = "1"
          test "$(mysql -h127.0.0.1 -uroot -ppassword -Nse "select count(*) from ai_run where conversation_id=$LONG_CONV_ID and status='COMPLETED' and input_tokens>0 and cache_read_tokens>0 and total_tokens>0" ry-vue)" -ge 1
          grep -q "COMPACTION_PROMPT_STRUCTURED=1" /tmp/mock-openai.log
          grep -q "COMPACTION_SOURCE_HAS_A=1" /tmp/mock-openai.log
          grep -q "CHECKPOINT_REINJECTED=1" /tmp/mock-openai.log
          grep -q "LATEST_USER_RAW=1" /tmp/mock-openai.log
          grep -q "CACHE_KEY=ruoyi:conv:$LONG_CONV_ID:system:" /tmp/mock-openai.log
          grep -q "CACHE_KEY=ruoyi:compaction:$LONG_CONV_ID" /tmp/mock-openai.log

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -X PUT             -d '{"contextWindowTokens":65536,"autoCompaction":true,"compactionThresholdPercent":75}'             "http://127.0.0.1:8080/ai/config/models/$MODEL_ID/runtime-settings" >/tmp/runtime-reset.json

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-backend-ci-logs
          path: |
            /tmp/maven-build.log
            /tmp/ruoyi-backend.log
            /tmp/mock-openai.log
            /tmp/test-chat.json
            /tmp/test-tools.json
            /tmp/turn1-response.json
            /tmp/turn2-response.json
            /tmp/turn3-response.json
            /tmp/turn4-response.json
            /tmp/cache-fallback-response.json
          if-no-files-found: warn
