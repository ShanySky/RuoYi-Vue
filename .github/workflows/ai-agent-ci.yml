name: AI Agent Backend CI

on:
  push:
    branches:
      - chatgpt/ai-agent-assistant
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database
        run: |
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/ry_20260417.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/quartz.sql
          mysql -h127.0.0.1 -uroot -ppassword ry-vue < sql/ai_20260918.sql
          mysql -h127.0.0.1 -uroot -ppassword -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ry-vue' AND table_name LIKE 'ai_%';"

      - name: Build backend
        run: mvn -B -DskipTests clean package
